<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<title>Compendium Editor</title>
	<style>
		:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#202020;color:#ddd;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{overflow:hidden}.login-overlay{position:fixed;inset:0;display:grid;place-items:center;background:#202020;z-index:20}.login-box{width:min(390px,calc(100% - 30px));padding:24px;background:#292929;border:1px solid #3d3d3d;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.2)}.login-box h1{margin:0 0 20px;font-size:21px}.login-box input{display:block;width:100%;height:40px;margin:8px 0;padding:0 11px;background:#202020;border:1px solid #4b4b4b;border-radius:6px;color:#ddd;outline:none}.login-box input:focus{border-color:#777}.login-box button{width:100%;height:40px;margin-top:8px;background:#3a382d;border:1px solid #5a5540;border-radius:6px;color:#e4ca4e;cursor:pointer}.login-status{min-height:17px;margin-top:10px;color:#999;font-size:12px}.editor{display:grid;grid-template-rows:auto minmax(0,1fr);width:100%;height:100%}.editor-top{height:58px;display:flex;align-items:center;gap:8px;padding:10px;background:#292929;border-bottom:1px solid #3d3d3d}.editor-title{min-width:0;flex:1;height:38px;padding:0 11px;background:#202020;border:1px solid #4b4b4b;border-radius:6px;color:#ddd;outline:none}.editor-title:focus{border-color:#777}.editor-button{height:38px;padding:0 15px;background:#292929;border:1px solid #4b4b4b;border-radius:6px;color:#bbb;cursor:pointer}.editor-button:hover{background:#343434;color:#eee}.editor-button.save{color:#e4ca4e}.editor-text{display:block;width:100%;height:100%;resize:none;border:0;outline:0;padding:18px 20px;background:#202020;color:#ddd;font:14px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.35);z-index:30}.modal.open{display:flex}.modal-box{width:min(560px,100%);max-height:min(80vh,700px);overflow:auto;background:#292929;border:1px solid #444;border-radius:10px;box-shadow:0 14px 45px rgba(0,0,0,.28)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px;border-bottom:1px solid #3d3d3d}.modal-head h2{margin:0;font-size:16px}.modal-close{width:32px;height:32px;background:#292929;border:1px solid #4b4b4b;border-radius:6px;color:#bbb;font-size:18px;cursor:pointer}.data-list{padding:8px}.data-row{display:flex;align-items:center;gap:4px}.data-item{display:block;min-width:0;flex:1;padding:10px;border:0;border-radius:6px;background:none;color:#bbb;text-align:left;cursor:pointer}.data-item:hover{background:#343434;color:#eee}.data-delete{width:34px;height:34px;border:0;border-radius:6px;background:none;color:#777;font-size:18px;cursor:pointer}.data-delete:hover{background:#3a2c2c;color:#e07070}.data-empty{padding:16px;color:#777;font-size:12px}.save-status{padding:0 4px;color:#777;font-size:11px;white-space:nowrap}@media(max-width:600px){.editor-top{gap:6px;padding:8px;height:54px}.editor-button{padding:0 11px}.save-status{display:none}.editor-text{padding:14px;font-size:13px}.modal{padding:10px}.modal-box{max-height:90vh}}
	</style>
</head>
<body>
	<div id="loginOverlay" class="login-overlay">
		<div class="login-box">
			<h1>Compendium Editor</h1>
			<input id="username" autocomplete="username" placeholder="Username">
			<input id="password" type="password" autocomplete="current-password" placeholder="Password">
			<button id="loginButton" type="button">Login</button>
			<div id="loginStatus" class="login-status"></div>
		</div>
	</div>
	<div id="editorPage" class="editor">
		<div class="editor-top">
			<input id="editorTitle" class="editor-title" placeholder="Section/Content Title" pattern="^[^/]+/[^/]+$" title="Enter Section/Content Title" required autocomplete="off">
			<span id="saveStatus" class="save-status"></span>
			<button id="selectData" class="editor-button" type="button">Select</button>
			<button id="saveData" class="editor-button save" type="button">Save</button>
		</div>
		<textarea id="editorText" class="editor-text" spellcheck="false" placeholder="Write your knowledge here…"></textarea>
	</div>
	<div id="dataModal" class="modal">
		<div class="modal-box">
			<div class="modal-head"><h2>Select data</h2><button id="closeData" class="modal-close" type="button">×</button></div>
			<div id="dataList" class="data-list"></div>
		</div>
	</div>
	<script src="../js/codec.js"></script>
	<script src="../js/renderBlueprint.js"></script>
	<script src="./js/main.js"></script>
</body>
</html>
